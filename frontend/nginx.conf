# new-api-stat 前端 nginx 配置
# - 静态资源由 Vite 构建，base 默认 /new-api-stat/（与 frontend/Dockerfile 的 VITE_BASE_PATH 对应；
#   如需其它子路径，请同步修改 compose 的 VITE_BASE_PATH 与本文件的 location 前缀）
# - /new-api-stat-api 反向代理到后端服务（compose 中服务名为 backend，端口 8082）
server {
    listen       80;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端 API / Swagger / 健康检查等：保留原始 URI 转发
    location /new-api-stat-api {
        proxy_pass http://backend:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端静态资源（index.html 与 assets/）
    location /new-api-stat/ {
        alias /usr/share/nginx/html/;
    }

    # 根路径与不带尾部斜杠的访问均跳转到应用首页
    location = / {
        return 302 /new-api-stat/;
    }
    location = /new-api-stat {
        return 302 /new-api-stat/;
    }

    location / {
        return 404;
    }
}